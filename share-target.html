<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공유 중 | intip</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#11685c" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f4ef;
        --panel: #fff;
        --ink: #202124;
        --muted: #756f66;
        --line: #ded8cf;
        --accent: #11685c;
        --danger: #a13b24;
        --shadow: 0 18px 48px rgba(34, 30, 24, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(180deg, rgba(17, 104, 92, 0.12), transparent 320px),
          var(--bg);
        color: var(--ink);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Apple SD Gothic Neo",
          "Malgun Gothic",
          sans-serif;
      }

      .card {
        width: min(100%, 460px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 28px 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.45rem;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }

      .meter {
        margin-top: 20px;
        width: 100%;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: #e8e2d8;
      }

      .bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #11685c, #1f8a7b);
        transition: width 0.2s ease;
      }

      .meta {
        margin-top: 12px;
        font-size: 0.94rem;
        color: var(--muted);
      }

      .actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
      }

      .hidden {
        display: none;
      }

      a,
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      .ghost {
        background: #edf5f2;
        color: var(--accent);
      }

      .error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="title">공유 파일 준비 중</h1>
      <p id="message">앱으로 전달된 파일을 확인하고 있어요.</p>
      <div class="meter" aria-hidden="true">
        <div class="bar" id="bar"></div>
      </div>
      <div class="meta" id="meta">잠시만 기다려주세요.</div>
      <div class="actions">
        <a href="/" id="homeLink">홈으로</a>
        <button class="ghost hidden" id="retryButton" type="button">다시 시도</button>
      </div>
    </main>

    <script>
      const SHARE_DB = "intip-share-target";
      const SHARE_STORE = "shared-files";
      const IMAGE_EXTENSIONS = new Set([
        "png",
        "jpg",
        "jpeg",
        "gif",
        "webp",
        "svg",
        "bmp",
        "avif",
        "heic",
        "heif",
      ]);

      const MIME_BY_EXTENSION = {
        avif: "image/avif",
        bmp: "image/bmp",
        csv: "text/csv",
        gif: "image/gif",
        heic: "image/heic",
        heif: "image/heif",
        jpeg: "image/jpeg",
        jpg: "image/jpeg",
        json: "application/json",
        pdf: "application/pdf",
        png: "image/png",
        svg: "image/svg+xml",
        txt: "text/plain",
        webp: "image/webp",
        zip: "application/zip",
      };

      const $ = (id) => document.getElementById(id);

      function extensionOf(name) {
        const value = String(name || "").trim().toLowerCase();
        const index = value.lastIndexOf(".");
        return index >= 0 ? value.slice(index + 1) : "";
      }

      function normalizeMimeType(name, type) {
        const value = String(type || "").trim().toLowerCase();
        if (value && value !== "application/octet-stream") return value;
        const extension = extensionOf(name);
        return MIME_BY_EXTENSION[extension] || value || "application/octet-stream";
      }

      function setStatus(title, message, meta, percent = null) {
        $("title").textContent = title;
        $("message").textContent = message;
        $("meta").textContent = meta;
        $("bar").style.width = percent == null ? "8%" : `${Math.max(0, Math.min(100, percent))}%`;
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        });

        const contentType = response.headers.get("Content-Type") || "";
        const data = contentType.includes("application/json")
          ? await response.json()
          : null;
        const text = data ? "" : await response.text().catch(() => "");

        if (!response.ok) {
          throw new Error(
            data?.error || text || `요청에 실패했습니다. (${response.status})`,
          );
        }

        return data;
      }

      function openShareDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(SHARE_DB, 1);
          request.onupgradeneeded = () => {
            request.result.createObjectStore(SHARE_STORE, { keyPath: "id" });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      async function getSharedRecords() {
        if (!("indexedDB" in window)) return [];
        const db = await openShareDb();
        const records = await new Promise((resolve, reject) => {
          const transaction = db.transaction(SHARE_STORE, "readonly");
          const request = transaction.objectStore(SHARE_STORE).getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
        db.close();

        return records
          .filter((record) => record.file && (record.file instanceof Blob || (typeof File !== "undefined" && record.file instanceof File)))
          .map((record) => {
            const type = normalizeMimeType(record.name, record.type || record.file?.type);
            if (typeof File !== "undefined" && !(record.file instanceof File)) {
              return {
                ...record,
                type,
                file: new File([record.file], record.name || "shared-file", {
                  type,
                  lastModified: record.createdAt || Date.now(),
                }),
              };
            }

            if (record.file.type !== type) {
              return {
                ...record,
                type,
                file: new File([record.file], record.name || record.file.name || "shared-file", {
                  type,
                  lastModified: record.file.lastModified || record.createdAt || Date.now(),
                }),
              };
            }

            return { ...record, type };
          });
      }

      async function clearSharedRecords(ids) {
        if (!ids.length || !("indexedDB" in window)) return;
        const db = await openShareDb();
        await new Promise((resolve, reject) => {
          const transaction = db.transaction(SHARE_STORE, "readwrite");
          const store = transaction.objectStore(SHARE_STORE);
          ids.forEach((id) => store.delete(id));
          transaction.oncomplete = () => resolve();
          transaction.onerror = () => reject(transaction.error);
        });
        db.close();
      }

      function uploadToR2(url, file, onProgress) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("PUT", url);

          xhr.upload.addEventListener("progress", (event) => {
            if (!event.lengthComputable) {
              onProgress?.(null);
              return;
            }
            onProgress?.((event.loaded / event.total) * 100);
          });

          xhr.addEventListener("load", () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              resolve();
            } else {
              reject(new Error(`업로드에 실패했습니다. (${xhr.status})`));
            }
          });

          xhr.addEventListener("error", () => {
            reject(new Error("업로드 중 네트워크 오류가 발생했습니다."));
          });

          xhr.addEventListener("abort", () => {
            reject(new Error("업로드가 취소되었습니다."));
          });

          xhr.send(file);
        });
      }

      async function uploadRecord(record, index, total) {
        const file = record.file;
        const type = normalizeMimeType(file.name || record.name, file.type || record.type);
        const normalizedFile =
          file.type === type
            ? file
            : new File([file], file.name || record.name || "shared-file", {
                type,
                lastModified: file.lastModified || record.createdAt || Date.now(),
              });

        setStatus(
          "공유 파일 업로드 중",
          normalizedFile.name || "공유 파일을 업로드하고 있어요.",
          `${index + 1}/${total} 업로드 중`,
          total ? (index / total) * 100 : 0,
        );

        const signed = await api("/api/files", {
          method: "POST",
          body: JSON.stringify({
            action: "upload-url",
            name: normalizedFile.name,
            type,
            size: normalizedFile.size,
          }),
        });

        await uploadToR2(signed.uploadUrl, normalizedFile, (progress) => {
          const base = total ? (index / total) * 100 : 0;
          const span = total ? 100 / total : 100;
          const percent = progress == null ? base : base + (progress / 100) * span;
          $("bar").style.width = `${Math.max(5, Math.min(100, percent))}%`;
        });

        const data = await api("/api/files", {
          method: "POST",
          body: JSON.stringify({
            action: "complete",
            file: signed.file,
          }),
        });

        return data.file;
      }

      async function uploadSharedRecords() {
        const records = await getSharedRecords();
        if (!records.length) {
          setStatus("공유할 파일이 없어요", "새로 공유한 파일이 아직 없거나 이미 처리되었어요.", "홈으로 돌아갈게요.", 100);
          window.setTimeout(() => {
            window.location.replace("/");
          }, 500);
          return;
        }

        const succeededIds = [];
        const failures = [];

        for (const [index, record] of records.entries()) {
          try {
            await uploadRecord(record, index, records.length);
            succeededIds.push(record.id);
          } catch (error) {
            failures.push({
              id: record.id,
              name: record.name || record.file?.name || "shared-file",
              message: error.message,
            });
          }
        }

        if (succeededIds.length) {
          await clearSharedRecords(succeededIds);
        }

        if (failures.length) {
          const first = failures[0];
          $("retryButton").classList.remove("hidden");
          $("message").classList.add("error");
          setStatus(
            "일부 파일 업로드 실패",
            `${first.name} 업로드에 실패했어요.`,
            first.message,
            100,
          );
          return;
        }

        setStatus(
          "공유 완료",
          `${records.length}개 파일을 저장했어요.`,
          "잠시 후 홈으로 이동합니다.",
          100,
        );

        window.setTimeout(() => {
          window.location.replace("/?shared_done=1");
        }, 700);
      }

      async function boot() {
        const params = new URLSearchParams(window.location.search);
        if (params.has("shared_error")) {
          $("retryButton").classList.remove("hidden");
          setStatus(
            "공유 준비 실패",
            "공유 데이터를 여는 중 문제가 생겼어요.",
            params.get("shared_error") || "unknown",
            100,
          );
          $("message").classList.add("error");
          return;
        }

        try {
          const session = await api("/api/session");
          if (!session.authenticated) {
            $("retryButton").classList.add("hidden");
            setStatus(
              "로그인이 필요해요",
              "먼저 앱에서 로그인한 뒤 다시 공유해 주세요.",
              "홈으로 이동합니다.",
              100,
            );
            window.setTimeout(() => {
              window.location.replace("/");
            }, 900);
            return;
          }

          await uploadSharedRecords();
        } catch (error) {
          $("retryButton").classList.remove("hidden");
          $("message").classList.add("error");
          setStatus("공유 처리 실패", "공유 업로드 중 문제가 생겼어요.", error.message, 100);
        }
      }

      $("retryButton").addEventListener("click", () => {
        $("retryButton").classList.add("hidden");
        $("message").classList.remove("error");
        setStatus("다시 시도 중", "공유 파일을 다시 확인하고 있어요.", "잠시만 기다려주세요.", 12);
        boot();
      });

      boot();
    </script>
  </body>
</html>
